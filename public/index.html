<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ReelText — Instagram Caption Extractor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ── Step 1: Input Screen ── -->
  <div id="screen-input" class="screen active">
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 6h16M4 12h10M4 18h6"/>
      </svg>
      ReelText
    </div>

    <div class="hero">
      <h1 class="hero-title">Extract any<br><span>Instagram caption</span></h1>
      <p class="hero-sub">Paste a public Reel link and get the full caption text in seconds.</p>

      <div class="input-shell">
        <input
          type="url"
          id="reel-url"
          placeholder="instagram.com/reel/..."
          autocomplete="off"
          spellcheck="false"
        />
        <button id="extract-btn" onclick="extractCaption()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>
      </div>
      <p id="error-msg" class="error hidden"></p>
      <p class="input-hint">Supports /reel/ and /p/ URLs &nbsp;·&nbsp; Public accounts only</p>
    </div>

    <div class="screen-footer">No data stored &nbsp;·&nbsp; Free forever</div>
  </div>

  <!-- ── Step 2: Loading Screen ── -->
  <div id="screen-loading" class="screen">
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 6h16M4 12h10M4 18h6"/>
      </svg>
      ReelText
    </div>
    <div class="loading-body">
      <div class="pulse-ring"></div>
      <p class="loading-label">Fetching caption…</p>
    </div>
  </div>

  <!-- ── Step 3: Result Screen ── -->
  <div id="screen-result" class="screen">
    <div class="result-topbar">
      <button class="back-btn" onclick="goBack()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        New search
      </button>
      <div class="brand small">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 6h16M4 12h10M4 18h6"/>
        </svg>
        ReelText
      </div>
    </div>

    <div class="result-body">
      <div class="author-row">
        <div class="avatar" id="avatar-initials"></div>
        <div class="author-info">
          <p class="author-name" id="author-name"></p>
          <a class="author-link" id="author-link" href="#" target="_blank" rel="noopener">View profile ↗</a>
        </div>
      </div>

      <div class="caption-block">
        <div class="caption-label">Caption</div>
        <div id="caption-text" class="caption-text"></div>
      </div>

      <div class="result-actions">
        <span id="char-count" class="char-count"></span>
        <div class="btns">
          <button class="btn-copy" onclick="copyCaption()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            Copy
          </button>
          <span id="copy-confirm" class="copy-confirm hidden">Copied!</span>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
